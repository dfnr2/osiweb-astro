<!-- IF HONEYPOT_ENABLED -->
<!-- Honeypot field - hidden from humans via CSS, visible to bots parsing HTML -->
<dl style="position:absolute;left:-9999px;top:-9999px;height:0;width:0;overflow:hidden;opacity:0;">
    <dt>
        <label for="{HONEYPOT_FIELD_NAME}">{HONEYPOT_QUESTION}:</label>
    </dt>
    <dd>
        <input type="text" name="{HONEYPOT_FIELD_NAME}" id="{HONEYPOT_FIELD_NAME}" value="" autocomplete="off" tabindex="-1" />
        <!-- IF HONEYPOT_EXPLANATION -->
        <p>{HONEYPOT_EXPLANATION}</p>
        <!-- ENDIF -->
    </dd>
</dl>
<!-- ENDIF -->
